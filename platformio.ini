; Kona Radar - live ADS-B radar scope for the Waveshare ESP32-S3-Touch-AMOLED-1.43
;
;   pio run                     build the firmware (default env)
;   pio run -t upload           flash it over USB-C
;   pio run -e kona-radar-ota -t upload [--upload-port 192.168.1.42]
;                               flash it over Wi-Fi (needs KONA_RADAR_OTA_PASSWORD,
;                               see README "Firmware updates over Wi-Fi")
;   pio device monitor          serial log (115200)
;   pio test -e native          host-side unit tests (parsing, geo math, tracking)
;   pio run -e simulator && .pio/build/simulator/program
;                               render UI screenshots on the host into sim_out/

[platformio]
default_envs = kona-radar
boards_dir = boards

[common]
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
lvgl = lvgl/lvgl@8.4.0
arduinojson = bblanchon/ArduinoJson@7.4.2

[env:kona-radar]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = waveshare_esp32s3_touch_amoled_143
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<*> -<sim/>
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=2
    -Wall
; ---- Optional overrides (see include/config.h for the full list) ----
;   -DRADAR_CENTER_LAT=19.7388
;   -DRADAR_CENTER_LON=-156.0456
;   -DRADAR_CENTER_NAME=\"KOA\"
;   -DRADAR_DEFAULT_RANGE_NM=50
;   -DRADAR_REFRESH_INTERVAL_S=5
lib_deps =
    ${common.lvgl}
    ${common.arduinojson}

; Same firmware, uploaded over Wi-Fi with espota. The password is the one the
; radar shows (MENU > Settings on phone); pass it in the environment so it
; never lands in the repo:
;   KONA_RADAR_OTA_PASSWORD=12345678 pio run -e kona-radar-ota -t upload
; Phones aside, most computers resolve kona-radar.local; otherwise add
; --upload-port <ip>.
[env:kona-radar-ota]
extends = env:kona-radar
upload_protocol = espota
upload_port = kona-radar.local
upload_flags =
    --port=3232
    --auth=${sysenv.KONA_RADAR_OTA_PASSWORD}

; Host-side unit tests for lib/radar_core (no hardware needed).
[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude
    -std=gnu++17
    -Wall
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    ${common.arduinojson}
lib_ignore = lvgl

; Host-side UI simulator: runs the real LVGL UI code against canned data and
; writes PNG screenshots to sim_out/.
[env:simulator]
platform = native
build_src_filter = -<*> +<ui/> +<sim/>
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -DRADAR_SIMULATOR=1
    -O2
    -lm
lib_deps =
    ${common.lvgl}
    ${common.arduinojson}
